# Andrew Harder's website, using the unmodified Academic Pages layouts.
locale: "en-US"
site_theme: "contrast"
title: "Andrew Harder"
title_separator: "-"
name: "Andrew Harder"
description: "Andrew Harder, Associate Professor of Mathematics at Lehigh University. Algebraic geometry, Calabi-Yau varieties, mirror symmetry, and Hodge theory."
url: "https://ahrder.github.io"
baseurl: ""
repository: "ahrder/ahrder.github.io"

author:
  avatar: "andrew-harder.jpg"
  name: "Andrew Harder"
  bio: "Associate Professor of Mathematics"
  employer: "Lehigh University"
  location:
  email:
  github:

breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false
comments:
  provider: false
atom_feed:
  hide: true
og_image: "andrew-harder.jpg"
analytics:
  provider: false

include:
  - _pages
exclude:
  - .bundle
  - .github
  - .jekyll-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - UPSTREAM.md
  - AGENTS.md
  - MIGRATION.md
  - local
  - node_modules
  - package.json
  - package-lock.json
  - markdown_generator
  - scripts
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - vendor
  - tmp
  - files
  - CONTRIBUTING.md
  - .devcontainer
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  toc_levels: 1..6

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      comments: false
      share: false

sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
timezone: America/New_York
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
compress_html:
  clippings: all
  ignore:
    envs: development
